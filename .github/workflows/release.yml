name: Release

# A tag such as v2.0.0 builds Screencap, signs it with the Developer ID certificate, notarizes and staples it, and
# opens a draft GitHub release with the disk image, the update zip and their checksums; publishing the draft is a
# person's step. Run it by hand with a version such as 2.0.0-rc1 to check signing and notarization: the files are then
# kept as a workflow artifact and no release is made. It uses the repository secrets the Electron app's releases
# already used: APPLE_CERT_P12_BASE64 and APPLE_CERT_P12_PASSWORD to sign, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
# APPLE_TEAM_ID to notarize.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, such as 2.0.0-rc1
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then VERSION="${TAG#v}"; else VERSION="$INPUT_VERSION"; fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The version must look like 2.0.0 or 2.0.0-rc1, not \"$VERSION\""
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarize and staple
        env:
          SCREENCAP_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          SCREENCAP_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SCREENCAP_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release.sh "$VERSION"

      - name: Draft the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --title "Screencap $VERSION" --generate-notes \
            "build/release/Screencap-$VERSION.dmg" "build/release/Screencap-$VERSION.zip" \
            "build/release/Screencap-$VERSION.sha256"

      - name: Keep the files of a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: screencap-${{ env.VERSION }}
          path: build/release/
          retention-days: 7

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
