name: CI

# Builds and tests every push to main and every pull request, and checks that the app bundle assembles (ad hoc
# signed, since this runner holds no certificate).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build and test
        run: scripts/verify.sh
      - name: Assemble the app bundle
        run: SCREENCAP_SIGNING_IDENTITY=- scripts/build-app.sh
